version: '3.8'

volumes:
  db_storage:
  n8n_storage:

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=mein_sicheres_passwort
      - POSTGRES_DB=n8n
    volumes:
      - db_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    build: .
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=mein_sicheres_passwort
      - N8N_ENCRYPTION_KEY=bitte_aendern_langer_zufallsstring
      - GENERIC_TIMEZONE=Europe/Vienna
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/root/.n8n
      - ./workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy