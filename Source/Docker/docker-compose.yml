services:

  db:
    build:
      context: ./db
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - catermate_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ../..
      dockerfile: Source/Docker/backend/Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${DB_NAME};User ID=${DB_USER};Password=${DB_PASSWORD};CharSet=utf8mb4;"
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - catermate_net

  n8n_postgres:
    image: postgres:16
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - n8n_pg_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - catermate_net

  n8n:
    build:
      context: ../ai-service
    restart: always
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      GENERIC_TIMEZONE: ${TIMEZONE}
      WEBHOOK_URL: ${WEBHOOK_URL}
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - n8n_data:/root/.n8n
      - ../ai-service/workflows:/workflows
    depends_on:
      n8n_postgres:
        condition: service_healthy
    networks:
      - catermate_net

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    command: http n8n:5678 --domain=sequence-amusable-sash.ngrok-free.dev
    env_file: .env
    depends_on:
      - n8n
    networks:
      - catermate_net

volumes:
  db_data:
  n8n_data:
  n8n_pg_storage:

networks:
  catermate_net:
    driver: bridge
